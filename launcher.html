<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Launcher</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    color: #e2e8f0;
  }
  .card {
    text-align: center;
    padding: 40px 32px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    max-width: 360px;
    width: 90%;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    font-weight: 600;
  }
  button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    padding: 16px 36px;
    font-size: 17px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; cursor: default; }
  #status {
    margin-top: 16px;
    color: #94a3b8;
    font-size: 13px;
    min-height: 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎨 ComfyUI Launcher</h1>
    <button id="openBtn" onclick="openComfy()">🚀 افتح ComfyUI</button>
    <div id="status">اضغط الزرار عشان يجيب آخر رابط شغال</div>
  </div>

<script>
// رابط الـ Gist الخام بتاعك (gistfile1.txt) — معبّى بالفعل
const GIST_RAW_URL = "https://gist.githubusercontent.com/Joey8833/8f11a490d2829a4d68c0e3d4a5b2b75e/raw/gistfile1.txt";

async function openComfy() {
  const btn = document.getElementById('openBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = "جاري جلب آخر رابط...";

  try {
    const res = await fetch(GIST_RAW_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const url = (await res.text()).trim();

    if (!/^https:\/\//.test(url)) {
      throw new Error("الرابط المستلم غير صالح");
    }

    status.textContent = "تم — جاري التحويل...";
    window.location.href = url;
  } catch (err) {
    status.textContent = "⚠️ تعذر جلب الرابط — تأكد إن الخلية شغالة على Kaggle وحدّثت الـ Gist";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
